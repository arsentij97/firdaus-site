    each('[data-text="email"]', function (n) { n.textContent = C.email; });
    each('[data-text="partners"]', function (n) { n.textContent = C.partnersEmail; });

    WAKE.forEach(function (ev) { window.addEventListener(ev, phLoad, { capture: true, passive: true }); });

      var id = 'site-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      var body = JSON.stringify({
        api_key: C.posthogKey,
        event: '$pageview',
        distinct_id: id,

<body>
<div class="sh">
  <header class="sh-top"><a href="/" id="home" aria-label="Firdaus"><img src="/assets/logo-512.jpg" width="32" height="32" alt="">Firdaus</a></header>
  <main class="sh-main" id="main" aria-live="polite">

</div>
<script>
(function () {
  var C = window.FIRDAUS || { scheme: 'firdaus://', supabaseUrl: '', supabaseKey: '', appStoreUrl: 'https://apps.apple.com/app/id6806738733', appStoreLive: false };
  var ID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var q = new URLSearchParams(location.search);
  var m = /\/(r|p)\/([0-9a-fA-F-]{36})\/?$/.exec(location.pathname);
  var kind = m ? m[1] : (q.get('r') ? 'r' : q.get('p') ? 'p' : (/\/p\/?$/.test(location.pathname) ? 'p' : 'r'));
  var id = m ? m[2] : (q.get(kind) || '');
  var demo = q.get('demo');

  var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'ru'];
  var ru = false;

  var T = ru ? {
    open: 'Открыть в Firdaus', store: 'Загрузить в App Store', soon: 'Скоро в App Store',
    play: 'Смотреть ролик', reels: 'Reminders', more: 'Ещё', amin: 'Амин', replies: 'Ответов',
    fineReel: 'Reminders — короткие напоминания о вере и добром в приложении Firdaus. Без музыки и бесконечной ленты.',
    finePost: 'Firdaus — приложение, где близкие напоминают друг другу о намазе и делятся добрым.',
    fineSoon: 'Приложение выходит в App Store в конце ноября, иншаАллах. После установки открой эту ссылку ещё раз.',
    goneReel: 'Ролик недоступен', gonePost: 'Запись недоступна',
    goneP: 'Автор её убрал или открыл не всем. В Firdaus много другого доброго.',
    gonePReel: 'Автор его убрал или открыл не всем. В Firdaus много другого доброго.',
    broke: 'Не загрузилось', brokeP: 'Проверь связь и обнови страницу.',
    titleReel: function (n) { return n + ' · Reminders — Firdaus'; },

  } : {
    open: 'Open in Firdaus', store: 'Download on the App Store', soon: 'Coming soon to the App Store',
    play: 'Play video', reels: 'Reminders', more: 'More', amin: 'Ameen', replies: 'Replies',
    fineReel: 'Reminders are short reminders of faith and doing good in the Firdaus app. No music, no endless feed.',
    finePost: 'Firdaus is an app where loved ones remind each other to pray and share what is good.',
    fineSoon: 'The app launches on the App Store in late November, inshaAllah. After installing, open this link again.',
    goneReel: 'Video unavailable', gonePost: 'Post unavailable',
    goneP: 'The author removed it or did not share it with everyone. There is a lot more good in Firdaus.',
    gonePReel: 'The author removed it or did not share it with everyone. There is a lot more good in Firdaus.',
    broke: 'Could not load', brokeP: 'Check your connection and refresh the page.',
    titleReel: function (n) { return n + ' · Reminders — Firdaus'; },
    titlePost: function (n) { return 'Post by ' + n + ' — Firdaus'; }
  };

  var main = document.getElementById('main');
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var https = function (u) { return typeof u === 'string' && /^https:\/\//.test(u) ? u : null; };
  var clean = function (s, n) { return String(s || '').replace(/[\u0000-\u0008\u000b-\u001f\u007f‪-‮⁦-⁩]/g, '').slice(0, n); };

  function actions(deep) {
    var box = el('div', 'sh-acts');
    var open = el('a', 'btn', T.open);
    open.href = (C.scheme || 'firdaus://') + deep;
    var store = el('a', 'btn ghost');
    store.href = C.appStoreUrl;
    store.setAttribute('data-link', 'appstore');
    store.setAttribute('data-soon', T.soon);
    var lab = el('span', null, C.appStoreLive ? T.store : T.soon);

    store.appendChild(lab);

    box.appendChild(open);
    box.appendChild(store);
    return box;
  }

  function who(a) {
    var row = el('div', 'sh-who');
    var name = clean(a && a.name, 60) || ('@' + clean(a && a.nickname, 32));
    var ava;
    if (a && https(a.avatar_url)) { ava = el('img', 'sh-ava'); ava.src = a.avatar_url; ava.alt = ''; ava.width = 44; ava.height = 44; }
    else { ava = el('div', 'sh-ava', name.replace(/^@/, '').charAt(0).toUpperCase() || 'F'); ava.setAttribute('aria-hidden', 'true'); }
    var col = el('div');
    col.style.minWidth = '0';
    col.appendChild(el('div', 'sh-name', name));
    if (a && a.nickname) col.appendChild(el('div', 'sh-nick', '@' + clean(a.nickname, 32)));

    row.appendChild(col);

  }

  function text(s) {

    box.appendChild(el('h1', null, broke ? T.broke : (isReel ? T.goneReel : T.gonePost)));

    main.appendChild(box);
    main.appendChild(actions(''));
    main.appendChild(el('p', 'sh-fine', C.appStoreLive ? T.finePost : T.fineSoon));

  function reel(d) {
